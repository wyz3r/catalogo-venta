function options(){const base=products.filter(p=>state.section==="Todos"||p.section===state.section);const groups=[...new Set(base.map(p=>p.group).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));const brands=[...new Set(base.map(p=>p.brand).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));state.group=groups.includes(state.group)?state.group:"";state.brand=brands.includes(state.brand)?state.brand:"";$("group").innerHTML='<option value="">Todos los grupos</option>'+groups.map(v=>`<option>${esc(v)}</option>`).join("");$("brand").innerHTML='<option value="">Todas las marcas</option>'+brands.map(v=>`<option>${esc(v)}</option>`).join("");$("group").value=state.group;$("brand").value=state.brand}
function render(){const term=state.search.toLocaleLowerCase("es");const list=products.filter(p=>(state.section==="Todos"||p.section===state.section)&&(!term||[p.description,p.brand,p.sku,p.group,p.section].join(" ").toLocaleLowerCase("es").includes(term))&&(!state.group||p.group===state.group)&&(!state.brand||p.brand===state.brand));$("count").innerHTML=`<strong>${list.length.toLocaleString("es-MX")}</strong> de ${products.length.toLocaleString("es-MX")} productos`;$("products").innerHTML=list.length?list.map(p=>`<article class="product"><div class="top"><span class="brand">${esc(p.brand||"Sin marca")}</span><span class="group">${esc(p.group||p.section)}</span></div><div class="desc">${esc(p.description||"Sin descripción")}</div><div class="sku">SKU: ${esc(p.sku||"—")}</div><div class="stock">${p.quantity==null?"Existencia: consultar":`Existencia: ${Number(p.quantity).toLocaleString("es-MX")}`}</div><div class="prices"><div><span class="label">Precio de venta</span><span class="price">${money(p.price)}</span></div><div><span class="label">Precio con descuento</span><span class="price">${money(p.discountPrice)}</span></div><div class="house"><span class="label">Precio con descuento de casa</span><span class="price">${money(p.housePrice)}</span></div></div></article>`).join(""):'<div class="empty">No encontramos productos con esos filtros.<br>Prueba con otra búsqueda.</div>'}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-section]");if(!b)return;state.section=b.dataset.section;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===b));options();render()});
$("search").addEventListener("input",e=>{state.search=e.target.value;render()});$("group").addEventListener("change",e=>{state.group=e.target.value;render()});$("brand").addEventListener("change",e=>{state.brand=e.target.value;render()});options();render();
</script></body></html>
